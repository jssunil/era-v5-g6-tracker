name: build-g6-tracker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracker JSON & build dist/index.html + TRACKER.md
        run: python scripts/build.py
      - name: Upload HTML Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: g6-tracker-html
          path: |
            dist/index.html
            TRACKER.md
