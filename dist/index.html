<style>

:root{
  --bg:#f6f7fa; --panel:#ffffff; --ink:#161d2b; --muted:#5c6577; --line:#dde1ea;
  --accent:#3b4cb8; --accent-soft:#e7eafa;

  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131c; --panel:#171c28; --ink:#e4e8f1; --muted:#9aa3b6; --line:#283043;
  --accent:#97a4f2; --accent-soft:#222a4a;
  --ok:#5cc58a; --ok-soft:#163327; --warn:#e3a54a; --warn-soft:#3a2c14;
  --bad:#f08178; --bad-soft:#3c1d1b; --info:#97a4f2; --info-soft:#222a4a; --idle:#a0a9ba; --idle-soft:#212838;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --panel:#171c28; --ink:#e4e8f1; --muted:#9aa3b6; --line:#283043;
  --accent:#97a4f2; --accent-soft:#222a4a;
  --ok:#5cc58a; --ok-soft:#163327; --warn:#e3a54a; --warn-soft:#3a2c14;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-family:var(--display);font-weight:600;font-size:30px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:66ch}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stats small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 4px}
.lead{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:74ch}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.id{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
td.date{font-family:var(--mono);font-size:12px;white-space:nowrap}
.pill{display:inline-block;font:500 11px var(--body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-active{background:var(--info-soft);color:var(--info)}
.s-planned{background:var(--idle-soft);color:var(--idle)}
.s-at-risk{background:var(--warn-soft);color:var(--warn)}
.s-blocked{background:var(--bad-soft);color:var(--bad)}
.ev{font-size:12px;color:var(--muted);margin-top:3px}
.ev a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.ev a:hover{border-bottom-style:solid}
.links-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.link-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:500;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;transition:all .15s ease}
.link-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.link-chip svg{width:13px;height:13px;fill:currentColor;flex-shrink:0}
header .src a{color:var(--accent);text-decoration:none}
header .src a:hover{text-decoration:underline}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.gantt{overflow-x:auto}
.gantt svg{display:block;min-width:760px}
.gantt text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.gantt .lbl{fill:var(--ink);font-size:12px}
.gantt .grid{stroke:var(--line)}
.gantt .today{stroke:var(--bad);stroke-width:1.5}
ul.q{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.q .topic{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
footer{color:var(--muted);font-size:12px}
</style>

<style>
.tag{display:inline-block;font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.hard{color:var(--bad);background:var(--bad-soft)}
.tag.lane{color:var(--accent);background:var(--accent-soft)}
.badge{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 8px;margin-right:8px}
.badge.ext{background:var(--accent-soft);color:var(--accent)}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
td.ans{color:var(--muted);font-size:13px}
</style>

  sections.push(sec("Cross-Team & Internal Questions","Open questions for G4 (Architecture), G5 (Training), G8 (Monitoring), and Team G6.",qs.length?`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Target</th><th>Question</th><th>Answer / Resolution</th><th>Status</th></tr></thead><tbody>`+qs.map(q=>`<tr><td class="id">${esc(q.id)}</td><td class="id" style="font-family:var(--body);text-transform:uppercase;letter-spacing:.06em;font-size:11px">${esc(q.topic)}</td><td>${linkify(q.question)}</td><td class="ans">${linkify(q.answer||"—")}</td><td>${q.status==="answered"?`<span class="pill s-done">Answered</span>`:`<span class="pill s-planned">Open</span>`}</td></tr>`).join("")+`</tbody></table></div>`:`<div class="empty">No open questions.</div>`));

  document.getElementById("sections").innerHTML=sections.join("");
  document.getElementById("foot").innerHTML=`Public Team G6 tracker repo: <a href="${REPO_URL}" target="_blank" rel="noopener">era-v5-g6-tracker</a> (<code>tracker/*.json</code> &amp; <code>TRACKER.md</code>). Every update is a PR/commit. Built from commit ${commitLink}. · <a href="${REPO_URL}/blob/main/README.md" target="_blank" rel="noopener">README</a> · <a href="${REPO_URL}/blob/main/TRACKER.md" target="_blank" rel="noopener">TRACKER.md</a>`;
})();
</script>
